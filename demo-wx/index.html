<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>京东优选 · 社群智能响应（微信仿真演示）</title>
<style>
:root{
  --wx-green:#3E7C68; --wx-green-d:#2E5F50; --bubble-me:#E4EBE7; --bubble-other:#FFFFFF;
  --ink:#23272E; --sub:#7C828C; --faint:#A8AEB8; --line:#E8EAEE;
  --panel-bg:#F6F7F9; --nav:#222B36; --exp:#3C5870; --exp-bg:#EEF2F6;
  --up:#A86A5C; --ok:#4E7A5A; --warn:#9A7B3F; --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(120% 90% at 50% 0%,#F1F3F6 0%,#E7EAEF 100%);color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:26px 18px 50px;display:flex;gap:26px;align-items:flex-start;justify-content:center}
@media(max-width:880px){.wrap{flex-direction:column;align-items:center;gap:22px}}

/* ============ 手机外壳 ============ */
.phone{width:380px;flex:none;background:#fff;border-radius:30px;border:1px solid #d2d7de;
  box-shadow:0 2px 5px rgba(30,40,55,.05) inset, 0 24px 60px rgba(30,40,55,.18);overflow:hidden;position:relative}
.wx-top{background:linear-gradient(180deg,#FAFBFC 0%,#F1F3F6 100%);border-bottom:1px solid #E2E5E9;padding:11px 14px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 0 rgba(255,255,255,.7) inset}
.wx-back{font-size:20px;color:#181818;cursor:default;width:20px}
.wx-title{flex:1;text-align:center;font-size:15.5px;font-weight:600;color:#181818;line-height:1.25}
.wx-title small{display:block;font-size:11px;font-weight:400;color:#9a9a9a}
.wx-more{font-size:20px;color:#181818;width:20px;text-align:right}

.wx-chat{height:560px;background:linear-gradient(180deg,#ECEEF1 0%,#E5E8EC 100%);overflow-y:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:13px}
.wx-chat::-webkit-scrollbar{width:0}
.wx-time{align-self:center;font-size:11px;color:#fff;background:rgba(0,0,0,.18);padding:2px 9px;border-radius:5px;margin:2px 0}
.wx-sys{align-self:center;max-width:88%;font-size:11.5px;color:#7d828b;background:rgba(0,0,0,.04);padding:5px 11px;border-radius:7px;text-align:center;line-height:1.5}

.wx-row{display:flex;gap:9px;align-items:flex-start;max-width:100%}
.wx-row.me{flex-direction:row-reverse}
.av{width:38px;height:38px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:600;color:#fff;font-family:inherit;box-shadow:0 1px 3px rgba(20,30,45,.18)}
.wx-col{display:flex;flex-direction:column;max-width:74%}
.wx-row.me .wx-col{align-items:flex-end}
.wx-name{font-size:11px;color:#9a9a9a;margin:0 2px 3px}
.bubble{position:relative;padding:8px 11px;border-radius:8px;font-size:14px;word-break:break-word;
  background:var(--bubble-other);box-shadow:0 1px 2px rgba(20,30,45,.07), 0 3px 9px rgba(20,30,45,.05);line-height:1.5}
.wx-row.me .bubble{background:linear-gradient(180deg,#EAF1ED 0%,#DEE9E3 100%);
  box-shadow:0 1px 2px rgba(62,124,104,.20), 0 3px 9px rgba(62,124,104,.13)}
.bubble::before{content:"";position:absolute;top:12px;width:0;height:0;border:6px solid transparent}
.wx-row:not(.me) .bubble::before{left:-11px;border-right-color:var(--bubble-other)}
.wx-row.me .bubble::before{right:-11px;border-left-color:var(--bubble-me)}

/* 机器人决策气泡 */
.bot .bubble{background:#fff;border:1px solid #e3e8ef;box-shadow:0 1px 2px rgba(20,30,45,.05), 0 4px 12px rgba(20,30,45,.04)}
.bot .bubble::before{border-right-color:#fff}
.bot-tag{display:inline-block;font-size:10px;font-weight:700;color:var(--wx-green);
  background:#E6F1EA;border-radius:4px;padding:1px 6px;margin-bottom:5px}
.bot-tag-off{color:var(--faint);background:#EDEEF0}
.verdict-push{color:var(--ok);font-weight:600}
.verdict-hold{color:var(--warn);font-weight:600}
.verdict-block{color:var(--up);font-weight:600}
.pcard{margin-top:8px;border:1px solid #eaeef2;border-radius:9px;overflow:hidden;background:#fafbfc;box-shadow:0 2px 10px rgba(20,30,45,.07)}
.pcard .pc-top{display:flex;gap:10px;padding:9px 10px;align-items:center}
.pc-thumb{width:42px;height:42px;border-radius:7px;background:#f0f2f5;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.pc-nm{font-size:13px;font-weight:600;line-height:1.3}
.pc-meta{font-size:11px;color:var(--sub);margin-top:1px}
.pc-pr{font-size:16px;font-weight:700;color:var(--up);margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.pc-pr small{font-size:10px;font-weight:400;color:var(--sub)}
.pc-ft{background:#f3f6f9;font-size:11px;color:var(--sub);padding:6px 10px;border-top:1px solid #eef1f4}
.pc-buy{margin-top:8px;background:var(--wx-green);color:#fff;text-align:center;border-radius:7px;padding:7px;font-size:12.5px;font-weight:600;cursor:pointer;user-select:none}
.pc-buy:active{opacity:.82}

/* 输入区 */
.wx-input{background:#F1F3F6;border-top:1px solid #E2E5E9;padding:10px 11px;display:flex;gap:8px;align-items:center;position:relative;box-shadow:inset 0 1px 0 rgba(0,0,0,.04)}
.wx-input input{flex:1;border:none;background:#fff;border-radius:8px;padding:9px 11px;font-size:14px;font-family:inherit;outline:none;box-shadow:0 1px 2px rgba(30,40,55,.04)}
.wx-input input:focus{box-shadow:0 0 0 2px rgba(62,124,104,.20)}
.wx-send{background:var(--wx-green);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:14px;
  font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;flex:none}
.wx-send:hover{background:var(--wx-green-d)}
.wx-send:disabled{opacity:.5;cursor:not-allowed}

/* @ 提及浮层（仿微信：输入 @ 弹出候选，点击/回车补全，免手敲全名） */
.mention-pop{position:absolute;left:10px;right:66px;bottom:calc(100% + 6px);background:#fff;border:1px solid var(--line);
  border-radius:10px;box-shadow:0 10px 30px rgba(30,42,56,.18);overflow:hidden;z-index:30;display:none}
.mention-item{display:flex;align-items:center;gap:7px;padding:9px 12px;font-size:13.5px;color:var(--ink);cursor:pointer;transition:.1s}
.mention-item:hover,.mention-item.active{background:#f0f3f2}
.mention-item .at{color:var(--wx-green);font-weight:700}
.mention-item .mi-sub{margin-left:auto;font-size:11px;color:var(--sub)}
.presets-wrap{background:#F6F7F9;border-top:1px solid #E8EAEE;overflow:hidden}
.presets-toggle{width:100%;text-align:left;background:transparent;border:none;padding:9px 12px;
  font-size:12px;color:var(--sub);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;letter-spacing:.3px}
.presets-toggle:hover{color:var(--ink)}
.presets-toggle .chev{transition:transform .22s ease;font-size:13px;line-height:1}
.presets-wrap.open .chev{transform:rotate(90deg)}
.presets{max-height:0;padding:0 10px;display:flex;gap:6px;flex-wrap:wrap;transition:max-height .26s ease,padding .26s ease;opacity:0}
.presets-wrap.open .presets{max-height:150px;padding:2px 10px 11px;opacity:1}
.chip{font-size:12px;color:#3a3f47;background:#fff;border:1px solid #e2e2e2;border-radius:8px;padding:5px 11px;cursor:pointer;transition:.15s;white-space:nowrap}
.chip:hover{border-color:var(--wx-green);color:var(--wx-green);background:#f3f9f5}

/* 多群切换条（演示"多个群同时监测"） */
.group-bar{display:flex;gap:6px;padding:8px 10px;background:#F4F6F8;border-bottom:1px solid #E8EAEE;overflow-x:auto}
.group-bar::-webkit-scrollbar{width:0;height:0}
.gchip{font-size:11px;color:var(--sub);background:#fff;border:1px solid #E2E5E9;border-radius:999px;padding:4px 10px;cursor:pointer;white-space:nowrap;transition:.15s;flex:none}
.gchip:hover{border-color:var(--wx-green);color:var(--wx-green)}
.gchip.on{background:var(--wx-green);border-color:var(--wx-green);color:#fff;font-weight:600}
.gbar-spacer{flex:1}

/* 测试集（一键自测，默认折叠） */
.test-wrap{background:#F6F7F9;border-top:1px solid #E8EAEE;overflow:hidden}
.test-toggle{width:100%;text-align:left;background:transparent;border:none;padding:9px 12px;font-size:12px;color:var(--sub);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;letter-spacing:.3px}
.test-toggle:hover{color:var(--ink)}
.test-toggle .chev{transition:transform .22s ease;font-size:13px;line-height:1}
.test-wrap.open .chev{transform:rotate(90deg)}
.test-body{max-height:0;padding:0 10px;overflow:hidden;transition:max-height .26s ease,padding .26s ease;opacity:0}
.test-wrap.open .test-body{max-height:460px;padding:2px 10px 11px;opacity:1}
.test-run{width:100%;background:var(--wx-green);color:#fff;border:none;border-radius:8px;padding:8px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
.test-run:hover{background:var(--wx-green-d)}
.test-res{margin-top:8px;font-size:11.5px;line-height:1.7;max-height:280px;overflow-y:auto}
.test-res .row{display:flex;gap:6px;align-items:flex-start;padding:3px 0;border-bottom:1px dashed #EDEFF2}
.test-res .ok{color:var(--ok);font-weight:700}
.test-res .no{color:var(--up);font-weight:700}
.test-res .tt{color:var(--sub);flex:1;min-width:0}

/* 线上中台联通状态 */
.sync-note{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--sub);margin-top:10px;padding:7px 11px;background:#F6F8FA;border:1px solid var(--line);border-radius:8px;letter-spacing:.2px}
.sync-note .dot{width:7px;height:7px;border-radius:50%;flex:none}
.sync-note.on .dot{background:var(--ok);box-shadow:0 0 0 3px rgba(94,138,111,.18)}
.sync-note:not(.on) .dot{background:var(--faint)}
.typing{display:flex;gap:4px;padding:10px 12px}
.typing i{width:7px;height:7px;border-radius:50%;background:#c3c7cd;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}

/* ============ 幕后链路面板 ============ */
.side{width:470px;flex:none;background:#fff;border-radius:16px;box-shadow:0 12px 34px rgba(20,30,45,.10);
  overflow:hidden;border:1px solid #eef0f3}
.side-h{padding:15px 18px;border-bottom:1px solid var(--line);background:var(--nav);color:#fff}
.side-h b{font-size:15px;font-weight:600}
.side-h p{font-size:11.5px;color:#aeb9c6;margin-top:3px}
.side-b{padding:14px 16px 18px;max-height:600px;overflow-y:auto}
.side-b::-webkit-scrollbar{width:6px}.side-b::-webkit-scrollbar-thumb{background:#d6dbe1;border-radius:3px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.kpi{background:var(--panel-bg);border:1px solid var(--line);border-radius:9px;padding:8px 6px;text-align:center}
.kpi .l{font-size:10.5px;color:var(--sub)}
.kpi .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px}

.steps{display:flex;flex-direction:column;gap:7px}
.step{display:flex;gap:11px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;transition:.2s}
.step.on{border-color:var(--exp);background:var(--exp-bg)}
.step.skip{opacity:.5}
.step .num{width:24px;height:24px;border-radius:50%;flex:none;background:#eef1f4;color:#7a828c;
  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.step.on .num{background:var(--exp);color:#fff}
.step .body{flex:1;min-width:0}
.step .st{display:flex;align-items:center;gap:7px}
.step .st b{font-size:12.5px;font-weight:600}
.step .badge{font-size:10px;font-weight:700;border-radius:4px;padding:1px 6px}
.b-pass{color:var(--ok);background:#eaf3ed}.b-skip{color:var(--sub);background:#f1f1ee}
.b-push{color:#fff;background:var(--ok)}.b-hold{color:#fff;background:var(--warn)}.b-block{color:#fff;background:var(--up)}
.step .dt{font-size:11.5px;color:var(--sub);margin-top:3px;line-height:1.5}
.step .dt code{background:#f3f5f8;color:#3a4654;border-radius:4px;padding:0 4px;font-size:11px}

.verdict-box{margin-top:14px;border-radius:11px;padding:13px 14px;border:1px solid}
.vb-push{background:#eef6f0;border-color:#cfe6d6}
.vb-hold{background:#faf5e9;border-color:#ecdcb8}
.vb-block{background:#fbeeea;border-color:#f0d3c9}
.verdict-box .vt{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px}
.verdict-box .vd{font-size:12px;color:#5a626b;margin-top:5px;line-height:1.55}
.legend-note{font-size:11px;color:var(--faint);margin-top:12px;line-height:1.6;border-top:1px dashed var(--line);padding-top:9px}
.btn-reset{margin-top:12px;width:100%;background:#fff;border:1px solid var(--line);border-radius:9px;
  padding:9px;font-size:12.5px;color:var(--ink);cursor:pointer;font-family:inherit}
.btn-reset:hover{background:#fafafa}
</style>
</head>

      </div>
    </div>
  </div>
</div>

/* 数量 + 实体抽取（让模型能识别你话里说的任意商品名与数量，不只火鸡面） */
const QTY_UNITS='样|个|袋|箱|瓶|份|包|件|盒|斤|桶|罐|支|条|双|副|把|本|辆|张|顶';
const QTY_NUM='\\d+|两|二|三|四|五|六|七|八|九|十';
const STOP_ENTITY=['东西','玩意','那个','这个','什么','点啥','一些','一个','别的','它'];
function extractQty(t){
  const m=t.match(new RegExp('('+QTY_NUM+')\\s*('+QTY_UNITS+')'));
  if(!m) return null;
  const map={两:2,二:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10};
  const n=/\d+/.test(m[1])?parseInt(m[1],10):map[m[1]];
  return {n,unit:m[2]};
}
function extractEntity(t){
  let s=t.replace(/@\S+\s?/g,'')
    .replace(new RegExp('('+QTY_NUM+')\\s*('+QTY_UNITS+')'),'')
    .replace(/我想|我要|帮我|给我|帮我看|帮我看看|看看|看下|看一下|看|找下|找|搜下|搜|查下|查|查询|问下|问|询|有没有|有吗|有啥|有活动|求推荐|推荐一下|推荐|哪个好|挑个|挑|选个|选|想买|要买|买点|买|下单|囤点|来点|多少钱|便宜点|便宜的|性价比|划算|以内|元以内|百元以内|一下|可以吗|可以|吗|呢|吧|啊|呀|哦|的|点啥|一些|一个|那个|这个|要|想|来|整|弄|搞|弄个|搞个|来个|整点|整一个|弄一个|搞一个|件|套/g,'')
    .replace(new RegExp('('+QTY_UNITS+')','g'),'')   // 清残留量词（如「个台灯」→「台灯」）
    .replace(/[\s,，。、！!？?]/g,'').trim();
  if(!s||STOP_ENTITY.includes(s)) return '';
  return s.length<=14?s:'';
}
/* 实体质量闸门：防止把"出去玩/哪里/吃什么"等非商品话也当成商品推送 */
const NON_PRODUCT_RE=/出去玩|出去|哪里|哪儿|什么地方|啥地方|去哪|去哪里|好玩|玩什么|有啥好玩|攻略|路线|附近|周边|地方|饭馆|餐厅|吃什么|吃啥|好吃的|看电影|电影|天气|时间|什么时候|怎么样|咋样|怎么办|怎么|办法|方法|服务|找人|找谁|装修|家政|保洁|课程|报名|预约|挂号|公交|地铁|停车|电影票|门票|景区|旅行|旅游|出差|上学|上班|公园|商场/;
function looksLikeProduct(ent){
  if(!ent) return false;
  if(STOP_ENTITY.includes(ent)) return false;
  if(/^(玩|吃|喝|去|看|问|找|逛|地方|哪里|啥|怎么|咋|出门|事情|事儿)$/.test(ent)) return false;
  if(NON_PRODUCT_RE.test(ent)) return false;
  return true;
}

/* 开放选品：面试官随手说的任何商品，都生成一个合理、稳定的商品卡片（价格/佣金/品类） */
function guessCat(ent){
  if(/灯|枕|被|床|沙发|桌|椅|收纳|杯|锅|碗|筷|衣|裤|鞋|帽|包|巾|纸|桶|架|垫|镜|锁|钩/.test(ent)) return '家居日用';
  if(/手机|电脑|耳机|充电|数据|键盘|鼠标|相机|平板|路由|音箱|线|器/.test(ent)) return '数码电器';
  if(/零食|吃|果|饮|米|面|肉|奶|茶|水|酒|糖|蛋糕|菜/.test(ent)) return '食品生鲜';
  if(/玩|书|笔|本|画|积木|球|运动|棋|吉他|钢琴|拍/.test(ent)) return '文体玩具';
  if(/霜|液|膏|粉|膜|洗|护|妆|口红|眉|甲|香/.test(ent)) return '个护美妆';
  if(/药|维|钙|保健|养生/.test(ent)) return '健康保健';
  return '生活好物';
}
function makeLongtailProduct(ent, catHint){
  let h=0; for(let i=0;i<ent.length;i++) h=(h*31+ent.charCodeAt(i))>>>0;
  const price=Math.round((9.9 + (h%2900)/10) * 10)/10;   // 稳定落在 9.9 ~ 299.8
  const comm=5 + ((h>>>3)%11);                             // 稳定落在 5% ~ 15%（无符号位移，避免个别字串算出 0）
  const cat=catHint || guessCat(ent);
  return {id:'LT', name:ent, cat, price, comm, longtail:true};
}

/* ===================== 判断引擎（与真平台一致） ===================== */
function preFilter(text, at){
  const ROBOT=['机器人小助手','机器人','小助手','京东优选助手'];
  if(ROBOT.includes(text)) return {pass:false,reason:'机器人消息'};
  if(/^\[营销卡片\]|^\[推广\]|^\[广告\]/.test(text)) return {pass:false,reason:'营销消息'};
  const trimmed=text.trim();
  if(trimmed.length<=3 && !at) return {pass:false,reason:'超短消息'};
  if(/^\[图片\]$|^\[表情\]$|^\[语音\]$|^(收到|好的|嗯|哦|哈|哈哈|哈哈哈哈|嗯嗯|哦哦|1|\+1)$|^接[龙]/.test(trimmed))
    return {pass:false,reason:'无语义噪声（寒暄/斗图/灌水）'};
  return {pass:true,reason:''};
}
function ruleRelevance(t){
  const hasProduct=RULE_MAP.some(r=>r.cats.some(c=>t.includes(c)));
  const hasIntent=/有没有|求推荐|想买|要买|买|下单|多少钱|有活动|有啥|有吗|推荐|哪个好|需要|想要|要/.test(t);
  const isComplaint=COMPLAINT_MARKERS.some(m=>t.includes(m));
  const relevant=hasProduct||hasIntent||isComplaint;
  return {relevant,confidence:relevant?0.85:0.2,isComplaint};
}
function ruleParse(t){
  let category='',keywords=[];
  for(const r of RULE_MAP){
    const hits=r.cats.filter(c=>t.includes(c));
    if(hits.length){category=r.cat;keywords=hits;break;}
  }
  const isComplaint=COMPLAINT_MARKERS.some(m=>t.includes(m));
  const hasBuy=/想买|要买|买点|买|下单|来点|囤点|求链接|有没有|有啥|有活动|有吗/.test(t);
  const hasRec=/求推荐|推荐|哪个好/.test(t);
  const hasCompare=/比价|便宜|多少钱|划算|贵|以内/.test(t);
  let intent='complain';
  if(isComplaint) intent='complain';
  else if(hasCompare) intent='compare';
  else if(hasRec) intent='ask_rec';
  else if(hasBuy) intent='want_buy';
  else if(category) intent='ask_rec';
  const priceMatch=t.match(/(便宜的|便宜点|百元以内|\d+元以内|性价比|以内)/);
  const qty=extractQty(t);
  return {category:category||'未知',keywords,intent,price_pref:priceMatch?priceMatch[1]:null,qty};
}
function router(at,relevant,intent){
  const isRelevant=relevant && intent!=='complain';
  if(at && isRelevant) return {outlet:'robot_push',reason:'艾特 + 商品相关 → 机器人直接群内推品（秒级）'};
  if(at && !isRelevant) return {outlet:'push_owner',reason:'艾特 + 非商品需求 → Push 群主跟进回复'};
  if(!at && isRelevant) return {outlet:'triple',reason:'无艾特 + 真实需求 → 三路并行（置顶+Push+排期替换，分钟级）'};
  return {outlet:'discard',reason:'无艾特 + 不相关 → 静默丢弃（隐私护栏）'};
}
function recommend(cat,keywords,pricePref){
  let cands=PRODUCTS.filter(p=>p.cat===cat);
  if(cands.length===0){
    const kw=PRODUCTS.filter(p=>keywords.some(k=>p.name.includes(k)||p.cat.includes(k)));
    if(kw.length===0) return [];
    cands=kw;
  } else if(keywords.length){
    // 优先命中话里提到的具体商品（如「火鸡面」优先于其它零食）
    const kw=cands.filter(p=>keywords.some(k=>p.name.includes(k)));
    if(kw.length) cands=kw;
  }
  let ranked=[...cands];
  if(pricePref && /便宜|低价|性价比|以内/.test(pricePref)) ranked.sort((a,b)=>a.price-b.price);
  else ranked.sort((a,b)=>b.comm-a.comm);
  return ranked.slice(0,3);
}

/* 主判断：返回结构化结果，供聊天气泡 + 面板共用 */
let counters={intake:0,filtered:0,responded:0,held:0,blocked:0};
function judge(rawText){
  counters.intake++;
  const at=/@/.test(rawText);
  const clean=rawText.replace(/@\S+\s?/g,'').trim()||rawText;
  const steps=[];
  // ①
  steps.push({n:1,name:'消息接入',badge:'pass',b:'已接入',dt:`群：幸福里邻居群(G001) · 发送人：我 · 艾特：${at?'是':'否'}`});
  // ②
  const f=preFilter(clean,at);
  if(!f.pass){
    counters.filtered++;
    steps.push({n:2,name:'前置过滤',badge:'block',b:'拦截',dt:`识别为「${f.reason}」，零模型成本，不进入后续处理。`});
    for(let i=3;i<=10;i++) steps.push({n:i,skip:true});
    return {verdict:'block',steps,
      chatNote:'【平台决策】识别为寒暄/表情/灌水，前置过滤，零模型成本，不处理不打扰。',at,intake:true};
  }
  steps.push({n:2,name:'前置过滤',badge:'pass',b:'通过',dt:'非噪声、非营销、语义完整，进入意图判定。'});
  // ③
  steps.push({n:3,name:'会话聚合窗',badge:'pass',b:'聚合完成',dt:'单条发言即一个发言单元（演示简化），送判定段。'});
  // ④
  const rel=ruleRelevance(clean);
  const pass4=rel.relevant && rel.confidence>=TAU;
  steps.push({n:4,name:'相关性判定 (BERT)',badge:pass4?'pass':'block',b:pass4?'相关':'不相关',
    dt:`置信度 <code>${rel.confidence}</code> ${rel.confidence>=TAU?'≥':'<'} 阈值 τ=<code>${TAU}</code> → ${pass4?'触发':'静默'}`});
  if(!pass4){
    counters.blocked++;
    for(let i=5;i<=10;i++) steps.push({n:i,skip:true});
    return {verdict:'block',steps,
      chatNote:'【平台决策】相关性不足（低于阈值 τ=0.85），按隐私护栏「静默不响应」，不扰民。',at};
  }
  // ⑤
  const parsed=ruleParse(clean);
  steps.push({n:5,name:'需求解析 (DeepSeek)',badge:'pass',b:'已解析',
    dt:`品类 <code>${parsed.category}</code> · 意图 <code>${parsed.intent}</code>${parsed.price_pref?` · 价格意向 <code>${parsed.price_pref}</code>`:''}`});
  // ⑥
  steps.push({n:6,name:'去重与频控',badge:'pass',b:'放行',
    dt:'首条同类需求，无需去重；本群非艾特响应余量 3/3（每日上限）。'});
  // ⑦
  const rt=router(at,rel.relevant,parsed.intent);
  const isComplaint=parsed.intent==='complain';
  steps.push({n:7,name:'分流决策 (艾特矩阵)',badge:'pass',b:'已分流',dt:rt.reason});
  // ⑧⑨
  let product=null,executed=false,resultNote='';
  if(isComplaint){
    // 吐槽：非新需求
    if(at){
      counters.blocked++;
      steps.push({n:8,name:'商品获取',badge:'skip',b:'跳过',dt:'吐槽非需求，不取商品。'});
      steps.push({n:9,name:'响应执行',badge:'block',b:'Push群主',dt:'艾特+吐槽 → Push 群主跟进，不推品。'});
      for(let i=10;i<=10;i++) steps.push({n:i,skip:true});
      return {verdict:'block',steps,chatNote:'【平台决策】识别为「已购吐槽」(非新需求)，艾特→Push群主跟进，不推品不打扰。',at};
    }else{
      counters.blocked++;
      steps.push({n:8,name:'商品获取',badge:'skip',b:'跳过',dt:'吐槽非需求，不取商品。'});
      steps.push({n:9,name:'响应执行',badge:'block',b:'静默',dt:'无艾特+吐槽 → 静默丢弃。'});
      steps.push({n:10,name:'数据回流',badge:'skip',b:'—',dt:'未产生响应，仅记日志。'});
      return {verdict:'block',steps,chatNote:'【平台决策】识别为「已购吐槽」(非新需求)，静默不推，避免打扰。',at};
    }
  }
  const cands=recommend(parsed.category,parsed.keywords,parsed.price_pref);
  const qty=parsed.qty;
  if(cands.length===0){
    // 开放选品：抽取你话里的任意商品实体，未预置也能识别并生成卡片推送（仅当实体"像商品"）
    const ent=extractEntity(clean);
    if(ent && looksLikeProduct(ent)){
      product=makeLongtailProduct(ent, parsed.category==='未知'?null:parsed.category);
      executed=true;counters.responded++;
      const qtxt=qty?` ×${qty.n}${qty.unit}`:'';
      steps.push({n:8,name:'商品获取',badge:'pass',b:'开放选品',dt:`品类未预置，实体抽取得到「<code>${ent}</code>」${qtxt}，判定为商品类→开放选品引擎命中并生成卡片。`});
      const urgency=rt.outlet==='robot_push'?'秒级':'分钟级';
      steps.push({n:9,name:'响应执行 (三出口)',badge:'push',b:'已响应',dt:`出口 <code>${rt.outlet}</code> · ${urgency} · 开放选品已识别并推送（标记待回填京东实时价）。`});
      steps.push({n:10,name:'数据回流',badge:'pass',b:'已记录',dt:'长尾需求写入记录表，标记「待补品」，运营次日补录京东实时价。'});
      return {verdict:'push',steps,product,qty,chatNote:`识别到你想买「${ent}${qtxt}」，已为你智能匹配并推送（开放选品：价格/佣金为演示占位，接入京东后回填实时价）。`,at,routed:rt.outlet};
    }
    counters.held++;
    const entShow=ent?`「${ent}」`:'（无）';
    steps.push({n:8,name:'商品获取',badge:'hold',b:'非商品',dt:`品类「${parsed.category}」无命中；实体 ${entShow} 判定为<strong>非商品类</strong>（如出游/问路/闲聊），不做商品匹配。`});
    steps.push({n:9,name:'响应执行',badge:'hold',b:'暂不推送',dt:'非购物类咨询不推商品；如确需人工，可艾特群主转接。'});
    steps.push({n:10,name:'数据回流',badge:'skip',b:'—',dt:'按非商品类咨询归档，不产生推品。'});
    return {verdict:'hold',steps,chatNote:'【平台决策】识别为非购物类咨询（不是买商品的需求），不推商品；这类可艾特群主转人工跟进。',at};
  }
  product=cands[0];
  executed=true;
  counters.responded++;
  const rankedTxt=cands.map(c=>`${c.name} ¥${c.price}`).join(' / ');
  steps.push({n:8,name:'商品获取',badge:'pass',b:'命中',dt:`候选 Top3：${rankedTxt} → 取 Top1 <code>${product.name}</code>`});
  let urgency='分钟级';
  if(rt.outlet==='robot_push'){urgency='秒级';resultNote='机器人已在群内即时推送。';}
  else if(rt.outlet==='triple'){resultNote='三路并行：群主端选品池置顶 + Push 群主 + 排期替换下一发品。';}
  steps.push({n:9,name:'响应执行 (三出口)',badge:'push',b:'已响应',dt:`出口 <code>${rt.outlet}</code> · ${urgency} · ${resultNote}`});
  steps.push({n:10,name:'数据回流',badge:'pass',b:'已记录',dt:'响应写入记录表，更新群点击活跃率看板（北极星指标）。'});
  return {verdict:'push',steps,product,qty,chatNote:resultNote,at,routed:rt.outlet};
}

const mentionPop=document.getElementById('mentionPop');

function renderMention(){
  mentionPop.innerHTML=mentionItems.map((it,i)=>

/* 邻居的真实需求：邻居提出 → 小助手实时响应（群像真的一样，人人都在被服务） */
const NEED_EVENTS=[
  '求推荐儿童保温杯，娃上学要用，要耐摔的',
  '猫粮快吃完了，有活动吗',
  '@京东优选 有没有便宜点的电饭煲，300以内',

  '想买点车厘子，哪里有便宜的',
  '洗衣液快没了，求推荐',
  '家里缺个台灯，有没有好用的',
  '@京东优选 今天有没有枣的优惠',
];
let lastNeedAt=0;
/* 掷骰子：邻居提需求 → 小助手带"正在输入"实时推送（面板同步展示判定） */
function maybeNeedEvent(){
  if(Date.now()-lastNeedAt<25000) return false;   // 需求事件冷却，避免刷屏
  if(Math.random()>0.35) return false;
  lastNeedAt=Date.now();
  const text=pick(NEED_EVENTS);
  const who=pick(GROUPS[currentGroup].neighbors);
  later(()=>{
    const tid=addTypingWho(who);
    later(()=>{removeTyping(tid);addOtherMsg(who,text);},750+Math.floor(Math.random()*450));
  },400);
  later(()=>{
    const tid2=addTyping();
    later(()=>{
      removeTyping(tid2);
      const res=judge(text);
      addBotResponse(res);
      renderPanel(res);
    },900+Math.floor(Math.random()*400));
  },2300);
  return true;
}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
const recentLines=[];
function pickFresh(pool){
  const fresh=pool.filter(l=>!recentLines.includes(l));
  const src=fresh.length?fresh:pool;
  const line=src[Math.floor(Math.random()*src.length)];
  recentLines.push(line);
  if(recentLines.length>14) recentLines.shift();
  return line;
}
function addTypingWho(name){
  const id='typing'+Date.now()+Math.floor(Math.random()*9999);
  chatEl.insertAdjacentHTML('beforeend',
    `<div class="wx-row" id="${id}"><div class="av" style="background:${AV_COLORS[name]||'#888'}">${name.slice(0,1)}</div>

  chatEl.insertAdjacentHTML('beforeend',
    `<div class="wx-row"><div class="av" style="background:${AV_COLORS[name]||'#888'}">${name.slice(0,1)}</div>
     <div class="wx-col"><div class="wx-name">${name}</div><div class="bubble">${esc(text)}</div></div></div>`);
  pruneChat();scrollChat();

}
/* 可追踪的定时器：暂停时能全部清掉，保证"真暂停" */
const chainTimers=[];
function later(fn,ms){const id=setTimeout(fn,ms);chainTimers.push(id);return id;}
function clearChainTimers(){while(chainTimers.length){clearTimeout(chainTimers.pop());}}
/* 把一条台词链交给 2~3 位不同邻居，带"正在输入"，接龙式发出 */
function deliverChain(chain){
  const pool=[...GROUPS[currentGroup].neighbors];
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  let t=500;
  chain.forEach((line,i)=>{
    const who=pool[i%pool.length];
    later(()=>{
      const tid=addTypingWho(who);
      later(()=>{removeTyping(tid);addOtherMsg(who,line);},750+Math.floor(Math.random()*450));
    },t);
    t+=1600+Math.floor(Math.random()*550);
  });
}
function neighborFollowUp(res, text){
  if(!autoChat) return;   // 已暂停自动聊天：只回你自己发的消息，邻居不接话
  let chain;
  const isComplaint=COMPLAINT_MARKERS.some(x=>text.includes(x));
  if(res.verdict==='push'){
    const ent=extractEntity(text.replace(/@\S+\s?/g,''))||'';
    const direct=!!ent && Math.random()<0.6;
    chain=pickFresh(direct?CHAIN_PUSH_DIRECT:CHAIN_PUSH);
    const p=res.product;
    chain=chain.map(l=>l.replace(/\{entity\}/g,ent).replace(/\{name\}/g,p?p.name:'').replace(/\{price\}/g,p?('¥'+p.price):''));
  } else if(res.verdict==='block'){
    chain=pickFresh(isComplaint?CHAIN_BLOCK_COMPLAINT:CHAIN_SILENCE);
  } else {
    chain=pickFresh(CHAIN_HOLD);
  }
  deliverChain(chain);
  armAmbient();
}
let ambientTimer=null;
let autoChat=true;   // 自动聊天总开关（环境闲聊 + 邻居接话）
function setAutoChat(on){
  autoChat=on;
  const btn=document.getElementById('autoToggle');
  if(btn){btn.textContent=on?'⏸ 暂停自动聊天':'▶ 继续自动聊天';btn.classList.toggle('on',on);}
  if(on){
    // 继续：先立刻聊一句（马上有反馈），再进入常态节奏
    later(()=>{if(autoChat) deliverChain(pickFresh(AMBIENT_CHAINS));},1000);
    armAmbient();
  }else{
    // 暂停：清掉环境定时器 + 所有在播的接话定时器，保证"真暂停"
    if(ambientTimer){clearTimeout(ambientTimer);ambientTimer=null;}
    clearChainTimers();
  }
}
/* 与中台的"开始/暂停"双向同步：本地点开关 → 推送中台；中台变了 → 轮询拉回 */
function toggleAutoChat(){
  const on=!autoChat;
  setAutoChat(on);
  fetch(ONLINE_API+'/api/control/pause',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paused:!on})}).catch(()=>{});
}
function pollPause(){
  if(!onlineOk) return;   // 未连上中台时只本地控制
  fetch(ONLINE_API+'/api/control/status')
    .then(r=>r.json())
    .then(j=>{
      if(j && typeof j.paused==='boolean'){
        if(j.paused && autoChat) setAutoChat(false);
        else if(!j.paused && !autoChat) setAutoChat(true);
      }
    }).catch(()=>{});
}
function armAmbient(){
  if(!autoChat) return;
  if(ambientTimer) clearTimeout(ambientTimer);
  ambientTimer=setTimeout(()=>{
    if(!autoChat) return;
    if(!maybeNeedEvent()) deliverChain(pickFresh(AMBIENT_CHAINS));
    armAmbient();
  },5000+Math.floor(Math.random()*2000));
}

  el.innerHTML=onlineOk
    ? `<span class="dot"></span>已连接线上中台 · 平台判定：${onlineLast||'—'}`
    : `<span class="dot"></span>离线模式（本页内置引擎判定，未连线上中台）`;
}
function fmtVerdict(j){
  const vcn={push:'推送',hold:'暂不推送',block:'不推',skip:'已去重'};
  return `${vcn[j.verdict]||j.verdict}${j.product?(' · '+j.product.name):''}`;
}
async function syncToPlatform(payload){
  try{
    const ctrl=new AbortController();
    const to=setTimeout(()=>ctrl.abort(),3000);
    const r=await fetch(ONLINE_API+'/api/ingest',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload),
      signal:ctrl.signal,
    });
    clearTimeout(to);
    if(!r.ok) throw new Error('http '+r.status);
    const j=await r.json();
    if(!j||!j.online) throw new Error('bad resp');
    onlineOk=true; onlineLast=fmtVerdict(j);
  }catch(e){ onlineOk=false; onlineLast=''; lastSyncFail=Date.now(); }
  updateSync();
}
function syncOnline(text){
  return syncToPlatform({group:currentGroup,user:'我',text,at:/@/.test(text)});
}
function syncNeighbor(user,text){
  // 所有消息都应进平台；仅当刚失败（4s 冷却）时暂缓，避免离线时逐条刷屏
  if(onlineOk===false && Date.now()-lastSyncFail<4000) return;
  syncToPlatform({group:currentGroup,user,text,at:false});
}
async function testOnline(){
  try{
    const ctrl=new AbortController();
    const to=setTimeout(()=>ctrl.abort(),3000);
    const r=await fetch(ONLINE_API+'/health',{signal:ctrl.signal});
    clearTimeout(to);
    onlineOk=r.ok; onlineLast='';
  }catch(e){ onlineOk=false; }
  updateSync();
  if(onlineOk) syncHistory();
}
/* 把当前群的聊天历史批量同步进中台（保证"微信页消息 = 中台消息"，每群只同步一次） */
const syncedGroups=new Set();
async function syncHistory(){
  if(onlineOk!==true) return;
  if(syncedGroups.has(currentGroup)) return;
  syncedGroups.add(currentGroup);
  const g=GROUPS[currentGroup];
  const items=g.history.filter(m=>m.who!=='京东优选助手')
    .map(m=>({group:currentGroup,user:m.who,text:m.text,at:/@/.test(m.text)}));
  if(!items.length) return;
  try{
    const ctrl=new AbortController();
    const to=setTimeout(()=>ctrl.abort(),8000);
    const r=await fetch(ONLINE_API+'/api/ingest-batch',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(items),signal:ctrl.signal,
    });
    clearTimeout(to);
    const j=await r.json();
    if(j&&j.online){ onlineOk=true; onlineLast=`已同步群历史 ${j.done} 条`; }
  }catch(e){ /* 静默失败，下次切群再试 */ }
  updateSync();
}

/* ===================== 交互 ===================== */
function doSend(text){
  text=text.trim();if(!text)return;
  addUserMsg(text);
  const tid=addTyping();
  sendBtn.disabled=true;inputEl.disabled=true;
  const res=judge(text);
  setTimeout(()=>{
    removeTyping(tid);
    addBotResponse(res);
    renderPanel(res);
    sendBtn.disabled=false;inputEl.disabled=false;inputEl.focus();
    neighborFollowUp(res, text);
    syncOnline(text);
  },900);
}
sendBtn.addEventListener('click',()=>{doSend(inputEl.value);inputEl.value='';});
inputEl.addEventListener('keydown',e=>{
  if(mentionVisible()){
    if(e.key==='Enter'){e.preventDefault();pickMention(mentionActive);}
    else if(e.key==='ArrowDown'){e.preventDefault();moveMention(1);}
    else if(e.key==='ArrowUp'){e.preventDefault();moveMention(-1);}
    else if(e.key==='Escape'){e.preventDefault();hideMention();}
    return;
  }
  if(e.key==='Enter'){doSend(inputEl.value);inputEl.value='';}
});

// 示例话术（默认折叠，点「示例话术 ›」展开；展开后也是纯话术，不像演示标签）

PRESETS.forEach(p=>{

/* 测试集：一键自测（先判定对错，再发到当前群自动演示） */
const TEST_CASES=[
  {label:'① 具体商品+数量', text:'我想要买2箱牛奶', expect:'push'},
  {label:'② 开放选品（池外商品）', text:'帮我看看有没有蓝牙耳机', expect:'push'},
  {label:'③ 想买+便宜', text:'有没有便宜点的枣子', expect:'push'},
  {label:'④ 艾特+相关', text:'@京东优选 有没有老人机推荐，字大声音大', expect:'push'},
  {label:'⑤ 比价+预算', text:'电饭煲有啥推荐的吗，300以内', expect:'push'},
  {label:'⑥ 儿童用品', text:'求推荐儿童保温杯，要耐摔的', expect:'push'},
  {label:'⑦ 已购吐槽（不推）', text:'上次买的洗衣液不好用，洗不干净', expect:'block'},
  {label:'⑧ 寒暄（静默）', text:'今天天气真不错啊', expect:'block'},
  {label:'⑨ 灌水噪声（过滤）', text:'收到', expect:'block'},
  {label:'⑩ 接龙（过滤）', text:'接龙：今晚跳操打卡 1.大鹏', expect:'block'},
  {label:'⑪ 出游推荐（不推）', text:'我想要出去玩，有没有什么地方推荐', expect:'hold'},
  {label:'⑫ 附近美食（不推）', text:'附近有什么好吃的推荐吗', expect:'hold'},
];
let testRunning=false;
function runTestSuite(){
  if(testRunning) return; testRunning=true;
  const resBox=document.getElementById('testRes');
  const vCN={push:'推送',hold:'暂不推',block:'不推'};
  let idx=0,pass=0,fail=0;
  resBox.innerHTML='<div style="color:var(--sub)">正在自动演示…（每条先判定、再发到当前群）</div>';
  const next=()=>{
    if(idx>=TEST_CASES.length){
      resBox.insertAdjacentHTML('afterbegin',
        `<div class="${fail?'no':'ok'}" style="font-size:13px;font-weight:700;padding:4px 0">✅ 自测完成：通过 ${pass}/${TEST_CASES.length}${fail?` · 未通过 ${fail} 条（红色✗，见下）`:''}</div>`);
      testRunning=false;return;
    }
    const tc=TEST_CASES[idx++];
    const res=judge(tc.text);
    const ok=res.verdict===tc.expect;
    if(ok)pass++;else fail++;
    resBox.insertAdjacentHTML('beforeend',
      `<div class="row"><span class="${ok?'ok':'no'}">${ok?'✓':'✗'}</span>
       <span class="tt">${tc.label} · <b>${tc.text}</b><br><span style="color:var(--faint)">期望 ${vCN[tc.expect]} → 实际 ${vCN[res.verdict]}</span></span></div>`);
    doSend(tc.text);
    setTimeout(next,2400);
  };
  next();
}
document.getElementById('testToggle').addEventListener('click',()=>{
  document.getElementById('testWrap').classList.toggle('open');
});
document.getElementById('testRunBtn').addEventListener('click',runTestSuite);
document.getElementById('presetsToggle').addEventListener('click',()=>{
